name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub Release
  id-token: write  # Required for trusted publishing

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/otk-ecdna
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync version references with tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
            echo "✓ Tag v${TAG_VERSION} matches package version"
            exit 0
          fi

          echo "⟳ Syncing version in workspace: $PKG_VERSION → $TAG_VERSION"
          echo "  (in-place only — repo sources are not modified)"

          sed -i "s/^version = \".*\"/version = \"$TAG_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$TAG_VERSION\"/" src/otk/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$TAG_VERSION\"/" otk_api/__init__.py
          sed -i "s/\*\*Version\*\*: .*/**Version**: $TAG_VERSION/" otk_api/README.md
          sed -i "s/version: str = \".*\"/version: str = \"$TAG_VERSION\"/" otk_api/api/schemas.py
          sed -i "s/version=\".*\"/version=\"$TAG_VERSION\"/" otk_api/api/main.py
          sed -i "s/version=\".*\"/version=\"$TAG_VERSION\"/" setup.py

          echo "✓ Workspace version synced — package will be built as $TAG_VERSION"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
